<html lang="en">
    <head>
        <title>Emira's Counter</title>
        <link rel="stylesheet" href="style.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
         <meta charset="utf-8">
         <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body class="bg-success bg-gradient">
    <h1 class="text-center mb-5 mt-5">Welcome to Emira's Counter</h1>
    <div id="counter-box" class="d-flex flex-column align-items-center justify-content-center border rounded p-4 border-black px-5 mt-5 bg-light">
        <h1>Counter</h1>
        <h2 id="count">0</h2>
        <button id="increment" class="btn btn-primary mb-2">+</button>
        <button id="reset" class="btn btn-secondary mb-2">Reset</button>
        <button id="decrement" class="btn btn-danger">-</button>
    </div>
    <footer class="text-end mt-5 mb-3 me-3 text-white">
  <p class="mb-0">Created by <strong>emira</strong></p>
</footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="script.js"></script>
    </body>
</html>
